<!doctype html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotina - Plataforma de Treinamento</title>
<link rel="stylesheet" href="assets/style.css?v=5">
</head>
<body>
  <div class="topbar">
    <div class="brand"><a href="index.html" style="color:inherit;text-decoration:none;">&larr; Plataforma de Treinamento</a></div>
    <nav>
      <a href="rotina.html">Rotina</a>
      <a href="admin_rotina.html">Admin Rotina</a>
      <span id="userEmail" class="hint"></span>
      <button class="btn-outline btn-sm" onclick="logout()">Sair</button>
    </nav>
  </div>

  <div class="container container-curso">
    <h2 id="tituloPagina" class="loading">Carregando rotinas...</h2>

    <div id="playerLayout" class="player-layout" style="display:none;">
      <div class="aulas-sidebar">
        <h3>Rotinas</h3>
        <div class="contador" id="contadorRotinas"></div>
        <input type="text" id="buscaRotina" placeholder="Pesquisar rotina..." oninput="renderLista()">
        <div id="listaRotinas" style="margin-top:10px;"></div>
      </div>

      <div class="player-main">
        <div class="player-frame-wrap doc-wrap">
          <iframe id="docFrame" src="about:blank" allowfullscreen></iframe>
        </div>
        <div class="hint" style="margin-top:6px;">
          Documento não carregou? <button class="btn-outline btn-sm" onclick="recarregarDoc()">Recarregar</button>
          <a id="linkAbrirDoc" class="btn-outline btn-sm" href="#" target="_blank" rel="noopener" style="text-decoration:none;">Abrir em nova aba</a>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
          <h2 class="player-title" id="tituloRotina"></h2>
          <button class="btn-outline btn-sm" id="btnEditar" onclick="editarRotina()">Editar</button>
        </div>
        <div class="hint" id="posicaoRotina"></div>
        <p class="player-desc" id="descRotina"></p>

        <div id="editForm" style="display:none; margin-top:8px;">
          <input type="text" id="editTituloInput" placeholder="Título da rotina">
          <textarea id="editDescInput" placeholder="Descrição da rotina" style="margin-top:8px;"></textarea>
          <div class="hint" style="margin-top:8px;">Duração de execução (hh:mm:ss)</div>
          <input type="text" id="editDuracaoInput" placeholder="00:00:00">
          <div class="hint" style="margin-top:8px;">Cor de fundo na lista</div>
          <div class="swatches" id="swatchesBg"></div>
          <div class="hint" style="margin-top:8px;">Cor da fonte na lista</div>
          <div class="swatches" id="swatchesFg"></div>
          <div style="display:flex; gap:8px; margin-top:8px;">
            <button class="btn" onclick="salvarEdicao()">Salvar</button>
            <button class="btn-outline" onclick="cancelarEdicao()">Cancelar</button>
          </div>
        </div>

        <div class="player-controls">
          <button class="btn-outline" id="btnAnterior" onclick="irAnterior()">&larr; Rotina anterior</button>
          <button class="btn" id="btnProximo" onclick="irProximo()">Próxima rotina &rarr;</button>
        </div>
      </div>
    </div>

    <div id="semRotinas" class="empty-state" style="display:none;">Nenhuma rotina cadastrada ainda.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabaseClient.js?v=2"></script>
  <script src="assets/auth-guard.js?v=2"></script>
  <script src="assets/duration-utils.js?v=3"></script>
  <script>
    let rotinas = [];
    let rotinaAtualId = null;
    const CHAVE_ULTIMO = "ultimaRotina";

    // Converte links do Google Docs/Sheets/Slides para a versão incorporável.
    function toEmbedUrl(url) {
      if (!url) return "about:blank";
      const m = url.match(/^(https:\/\/docs\.google\.com\/(document|spreadsheets|presentation)\/d\/[a-zA-Z0-9_-]+)/);
      if (!m) return url;
      const base = m[1];
      if (m[2] === "presentation") return `${base}/embed?start=false&loop=false`;
      if (m[2] === "spreadsheets") return `${base}/htmlview?widget=true&headers=false`;
      return `${base}/preview`;
    }

    // ---- Cores personalizadas (coluna jsonb "estilo": {"bg":"#hex","fg":"#hex"}) ----
    const CORES_FUNDO = ["", "#6c5ce7", "#0984e3", "#00b894", "#e17055", "#d63031", "#e84393", "#fdcb6e", "#2d3436", "#ffffff"];
    const CORES_FONTE = ["", "#ffffff", "#000000", "#fdcb6e", "#55efc4", "#74b9ff", "#fd79a8", "#ff7675", "#a29bfe", "#b2bec3"];
    let corFundoEdit = "", corFonteEdit = "";

    function corValida(v) {
      return typeof v === "string" && /^#[0-9a-fA-F]{6}$/.test(v) ? v : "";
    }

    function estiloCss(r) {
      const e = r.estilo || {};
      const bg = corValida(e.bg), fg = corValida(e.fg);
      return (bg ? `background:${bg};` : "") + (fg ? `color:${fg};` : "");
    }

    function renderSwatches(idEl, cores, selecionada, aoEscolher) {
      const el = document.getElementById(idEl);
      el.innerHTML = cores.map(cor =>
        `<button type="button" class="swatch ${cor === selecionada ? "sel" : ""} ${cor ? "" : "swatch-padrao"}"
           data-cor="${cor}" title="${cor || "Padrão"}" style="${cor ? `background:${cor};` : ""}"></button>`
      ).join("");
      el.querySelectorAll(".swatch").forEach(b => b.onclick = () => aoEscolher(b.dataset.cor));
    }

    function renderSwatchesEdicao() {
      renderSwatches("swatchesBg", CORES_FUNDO, corFundoEdit, cor => { corFundoEdit = cor; renderSwatchesEdicao(); });
      renderSwatches("swatchesFg", CORES_FONTE, corFonteEdit, cor => { corFonteEdit = cor; renderSwatchesEdicao(); });
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }

    function textoDuracao(r) {
      return r.duracao_segundos > 0 ? ` · Duração: ${segundosParaMMSS(r.duracao_segundos)}` : "";
    }

    async function carregarRotinas() {
      const { data, error } = await supabaseClient
        .from("rotina")
        .select("*")
        .order("id_rotina", { ascending: true });

      const titulo = document.getElementById("tituloPagina");
      if (error) {
        titulo.textContent = "Erro ao carregar rotinas: " + error.message;
        return;
      }

      titulo.textContent = "Rotina";
      titulo.classList.remove("loading");
      rotinas = data || [];

      if (rotinas.length === 0) {
        document.getElementById("semRotinas").style.display = "block";
        return;
      }

      document.getElementById("playerLayout").style.display = "grid";
      renderLista();

      const ultimoId = Number(localStorage.getItem(CHAVE_ULTIMO));
      const ultimo = rotinas.find(r => r.id_rotina === ultimoId);
      selecionarRotina(ultimo ? ultimo.id_rotina : rotinas[0].id_rotina);
    }

    function renderLista() {
      const termo = document.getElementById("buscaRotina").value.trim().toLowerCase();
      const filtradas = rotinas.filter(r => r.titulo.toLowerCase().includes(termo));

      document.getElementById("contadorRotinas").textContent =
        `${rotinas.length} rotina${rotinas.length === 1 ? "" : "s"}`;

      const container = document.getElementById("listaRotinas");
      if (filtradas.length === 0) {
        container.innerHTML = `<div class="hint">Nenhuma rotina encontrada.</div>`;
        return;
      }

      container.innerHTML = filtradas.map(r => {
        const idx = rotinas.findIndex(x => x.id_rotina === r.id_rotina);
        return `<div class="aula-item ${r.id_rotina === rotinaAtualId ? "active" : ""}" style="${estiloCss(r)}" onclick="selecionarRotina(${r.id_rotina})">
          <span class="num" style="color:inherit; opacity:.7;">${idx + 1}.</span>
          <span>${escapeHtml(r.titulo)}</span>
          ${r.duracao_segundos > 0 ? `<span style="margin-left:auto; opacity:.7; font-size:0.8rem;">${segundosParaMMSS(r.duracao_segundos)}</span>` : ""}
        </div>`;
      }).join("");
    }

    function mostrarDoc(r) {
      document.getElementById("docFrame").src = toEmbedUrl(r.url_rotina);
      document.getElementById("linkAbrirDoc").href = r.url_rotina;
    }

    function selecionarRotina(id) {
      const r = rotinas.find(x => x.id_rotina === id);
      if (!r) return;
      rotinaAtualId = id;
      localStorage.setItem(CHAVE_ULTIMO, id);
      cancelarEdicao();

      mostrarDoc(r);

      document.getElementById("tituloRotina").textContent = r.titulo;
      document.getElementById("descRotina").textContent = r.descricao || "";

      const idx = rotinas.findIndex(x => x.id_rotina === id);
      document.getElementById("posicaoRotina").textContent = `Rotina ${idx + 1} de ${rotinas.length}` + textoDuracao(r);
      document.getElementById("btnAnterior").disabled = idx <= 0;
      document.getElementById("btnProximo").disabled = idx >= rotinas.length - 1;

      renderLista();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function editarRotina() {
      const r = rotinas.find(x => x.id_rotina === rotinaAtualId);
      if (!r) return;
      document.getElementById("editTituloInput").value = r.titulo;
      document.getElementById("editDescInput").value = r.descricao || "";
      document.getElementById("editDuracaoInput").value = segundosParaHHMMSS(r.duracao_segundos);
      corFundoEdit = corValida((r.estilo || {}).bg);
      corFonteEdit = corValida((r.estilo || {}).fg);
      renderSwatchesEdicao();
      document.getElementById("tituloRotina").style.display = "none";
      document.getElementById("descRotina").style.display = "none";
      document.getElementById("btnEditar").style.display = "none";
      document.getElementById("editForm").style.display = "block";
    }

    function cancelarEdicao() {
      document.getElementById("tituloRotina").style.display = "";
      document.getElementById("descRotina").style.display = "";
      document.getElementById("btnEditar").style.display = "";
      document.getElementById("editForm").style.display = "none";
    }

    async function salvarEdicao() {
      const titulo = document.getElementById("editTituloInput").value.trim();
      const descricao = document.getElementById("editDescInput").value.trim();
      const duracao_segundos = parseDuracaoParaSegundos(document.getElementById("editDuracaoInput").value.trim());
      const estilo = {};
      if (corFundoEdit) estilo.bg = corFundoEdit;
      if (corFonteEdit) estilo.fg = corFonteEdit;
      if (!titulo) {
        alert("O título não pode ficar vazio.");
        return;
      }

      const { error } = await supabaseClient
        .from("rotina")
        .update({ titulo, descricao: descricao || null, estilo, duracao_segundos })
        .eq("id_rotina", rotinaAtualId);

      if (error) {
        alert("Erro ao salvar: " + error.message);
        return;
      }

      const r = rotinas.find(x => x.id_rotina === rotinaAtualId);
      r.titulo = titulo;
      r.descricao = descricao;
      r.estilo = estilo;
      r.duracao_segundos = duracao_segundos;

      const idx = rotinas.findIndex(x => x.id_rotina === rotinaAtualId);
      document.getElementById("posicaoRotina").textContent = `Rotina ${idx + 1} de ${rotinas.length}` + textoDuracao(r);
      document.getElementById("tituloRotina").textContent = titulo;
      document.getElementById("descRotina").textContent = descricao;
      renderLista();
      cancelarEdicao();
    }

    function recarregarDoc() {
      const r = rotinas.find(x => x.id_rotina === rotinaAtualId);
      if (r) mostrarDoc(r);
    }

    function irProximo() {
      const idx = rotinas.findIndex(x => x.id_rotina === rotinaAtualId);
      if (idx < rotinas.length - 1) selecionarRotina(rotinas[idx + 1].id_rotina);
    }

    function irAnterior() {
      const idx = rotinas.findIndex(x => x.id_rotina === rotinaAtualId);
      if (idx > 0) selecionarRotina(rotinas[idx - 1].id_rotina);
    }

    (async () => {
      await requireAuth();
      initTopbarUser("userEmail");
      carregarRotinas();
    })();
  </script>
</body>
</html>

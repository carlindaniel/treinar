<!doctype html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursos - Plataforma de Treinamento</title>
<link rel="stylesheet" href="assets/style.css?v=2">
</head>
<body>
  <div class="topbar">
    <div class="brand">Plataforma de Treinamento</div>
    <nav>
      <a href="dashboard.html">Cursos</a>
      <a href="admin.html">Administração</a>
      <span id="userEmail" class="hint"></span>
      <button class="btn-outline btn-sm" onclick="logout()">Sair</button>
    </nav>
  </div>

  <div class="container">
    <div class="section-title">
      <h2>Cursos disponíveis</h2>
    </div>

    <div class="filtros">
      <div>
        <label for="busca">Buscar</label>
        <input type="text" id="busca" placeholder="Nome ou categoria..." oninput="renderCursos()">
      </div>
      <div>
        <label for="filtroCategoria">Categoria</label>
        <select id="filtroCategoria" onchange="renderCursos()">
          <option value="">Todas</option>
        </select>
      </div>
      <div>
        <label for="filtroAulas">Nº de aulas</label>
        <select id="filtroAulas" onchange="renderCursos()">
          <option value="">Qualquer</option>
          <option value="1-5">1 a 5 aulas</option>
          <option value="6-15">6 a 15 aulas</option>
          <option value="16+">16 ou mais</option>
        </select>
      </div>
      <div>
        <label for="filtroDuracao">Carga horária</label>
        <select id="filtroDuracao" onchange="renderCursos()">
          <option value="">Qualquer</option>
          <option value="0-3600">Até 1h</option>
          <option value="3600-18000">1h a 5h</option>
          <option value="18000+">Mais de 5h</option>
        </select>
      </div>
      <div>
        <label for="ordenar">Ordenar por</label>
        <select id="ordenar" onchange="renderCursos()">
          <option value="nome-asc">Nome (A–Z)</option>
          <option value="nome-desc">Nome (Z–A)</option>
          <option value="aulas-desc">Mais aulas</option>
          <option value="aulas-asc">Menos aulas</option>
          <option value="duracao-desc">Maior carga horária</option>
          <option value="duracao-asc">Menor carga horária</option>
          <option value="categoria-asc">Categoria (A–Z)</option>
        </select>
      </div>
      <button class="btn-outline btn-sm" onclick="limparFiltros()">Limpar</button>
    </div>
    <p class="hint" id="contagem"></p>

    <div id="listaCursos" class="loading">Carregando cursos...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabaseClient.js?v=2"></script>
  <script src="assets/auth-guard.js?v=2"></script>
  <script src="assets/duration-utils.js?v=2"></script>
  <script>
    let cursos = [];

    async function carregarCursos() {
      const { data, error } = await supabaseClient
        .from("cursos_com_contagem")
        .select("*");

      const container = document.getElementById("listaCursos");
      if (error) {
        container.innerHTML = `<div class="error-msg">Erro ao carregar cursos: ${error.message}</div>`;
        return;
      }
      cursos = data || [];
      const sel = document.getElementById("filtroCategoria");
      const cats = [...new Set(cursos.map(c => c.categoria).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR"));
      sel.innerHTML = `<option value="">Todas</option>` +
        cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("") +
        `<option value="__sem">Sem categoria</option>`;
      renderCursos();
    }

    function limparFiltros() {
      ["busca", "filtroCategoria", "filtroAulas", "filtroDuracao"].forEach(id => document.getElementById(id).value = "");
      document.getElementById("ordenar").value = "nome-asc";
      renderCursos();
    }

    function dentroFaixa(valor, faixa) {
      if (!faixa) return true;
      if (faixa.endsWith("+")) return valor >= Number(faixa.slice(0, -1));
      const [min, max] = faixa.split("-").map(Number);
      return valor >= min && valor <= max;
    }

    function renderCursos() {
      const termo = document.getElementById("busca").value.trim().toLowerCase();
      const cat = document.getElementById("filtroCategoria").value;
      const faixaAulas = document.getElementById("filtroAulas").value;
      const faixaDuracao = document.getElementById("filtroDuracao").value;
      const [campo, dir] = document.getElementById("ordenar").value.split("-");

      const filtrados = cursos.filter(c =>
        (c.nome.toLowerCase().includes(termo) || (c.categoria || "").toLowerCase().includes(termo)) &&
        (!cat || (cat === "__sem" ? !c.categoria : c.categoria === cat)) &&
        dentroFaixa(Number(c.total_aulas) || 0, faixaAulas) &&
        dentroFaixa(Number(c.duracao_total_segundos) || 0, faixaDuracao)
      );

      const chave = {
        nome: c => c.nome,
        categoria: c => c.categoria || "",
        aulas: c => Number(c.total_aulas) || 0,
        duracao: c => Number(c.duracao_total_segundos) || 0
      }[campo];
      filtrados.sort((a, b) => {
        const x = chave(a), y = chave(b);
        const r = typeof x === "string" ? x.localeCompare(y, "pt-BR") : x - y;
        return dir === "desc" ? -r : r;
      });

      document.getElementById("contagem").textContent =
        `${filtrados.length} de ${cursos.length} curso${cursos.length == 1 ? "" : "s"}`;

      const container = document.getElementById("listaCursos");

      if (filtrados.length === 0) {
        container.innerHTML = `<div class="empty-state">Nenhum curso encontrado.</div>`;
        return;
      }

      container.innerHTML = `<div class="grid-cursos">
        ${filtrados.map(c => `
          <a class="curso-card" href="curso.html?id=${c.id_curso}">
            <span class="badge">${c.categoria ? escapeHtml(c.categoria) : "Sem categoria"}</span>
            <h3>${escapeHtml(c.nome)}</h3>
            <span class="meta">${c.total_aulas} aula${c.total_aulas == 1 ? "" : "s"} &middot; ${formatarCargaHoraria(c.duracao_total_segundos)}</span>
          </a>
        `).join("")}
      </div>`;
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    (async () => {
      await requireAuth();
      initTopbarUser("userEmail");
      carregarCursos();
    })();
  </script>
</body>
</html>

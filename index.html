<!doctype html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar - Plataforma de Treinamento</title>
<link rel="stylesheet" href="assets/style.css?v=2">
</head>
<body>
  <div class="auth-wrap">
    <div class="card auth-card">
      <h1>Plataforma de Treinamento</h1>
      <p class="sub">Faça login para acessar o conteúdo.</p>

      <form id="formAuth" onsubmit="return handleSubmit(event)">
        <label for="email">E-mail</label>
        <input type="email" id="email" required autocomplete="email">

        <label for="senha">Senha</label>
        <input type="password" id="senha" required autocomplete="current-password" minlength="6">

        <button type="submit" class="btn btn-block" id="btnSubmit">Entrar</button>
        <div class="error-msg" id="msgErro"></div>
      </form>

      <div id="menuOpcoes" style="display:none;">
        <p class="sub">O que você quer fazer?</p>
        <div class="grid-cursos">
          <a class="curso-card" href="dashboard.html">
            <h3>Estudo</h3>
            <span class="meta">Cursos e aulas</span>
          </a>
          <a class="curso-card" href="exercicios.html">
            <h3>Exercícios</h3>
            <span class="meta">Listas de exercícios</span>
          </a>
          <a class="curso-card" href="rotina.html">
            <h3>Rotina</h3>
            <span class="meta">Rotinas e hábitos</span>
          </a>
        </div>
        <button type="button" class="btn-outline btn-sm" style="margin-top:16px;" onclick="sair()">Sair</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabaseClient.js?v=2"></script>
  <script>
    async function handleSubmit(ev) {
      ev.preventDefault();
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      const msgErro = document.getElementById("msgErro");
      const btn = document.getElementById("btnSubmit");
      msgErro.textContent = "";
      btn.disabled = true;

      try {
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
        if (error) throw error;
        mostrarOpcoes();
      } catch (err) {
        msgErro.textContent = err.message || "Erro ao autenticar.";
      } finally {
        btn.disabled = false;
      }
      return false;
    }

    function mostrarOpcoes() {
      document.getElementById("formAuth").style.display = "none";
      document.querySelector(".auth-card .sub").style.display = "none";
      document.getElementById("menuOpcoes").style.display = "block";
    }

    async function sair() {
      await supabaseClient.auth.signOut();
      window.location.reload();
    }

    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) mostrarOpcoes();
    })();
  </script>
</body>
</html>

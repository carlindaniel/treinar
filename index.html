<!doctype html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar - Plataforma de Treinamento</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="card auth-card">
      <h1>Plataforma de Treinamento</h1>
      <p class="sub">Faça login para acessar o conteúdo.</p>

      <div class="tabs">
        <button id="tabLogin" class="active" onclick="setTab('login')">Entrar</button>
        <button id="tabSignup" onclick="setTab('signup')">Criar conta</button>
      </div>

      <form id="formAuth" onsubmit="return handleSubmit(event)">
        <label for="email">E-mail</label>
        <input type="email" id="email" required autocomplete="email">

        <label for="senha">Senha</label>
        <input type="password" id="senha" required autocomplete="current-password" minlength="6">

        <button type="submit" class="btn btn-block" id="btnSubmit">Entrar</button>
        <div class="error-msg" id="msgErro"></div>
        <div class="ok-msg" id="msgOk"></div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabaseClient.js"></script>
  <script>
    let modo = "login";

    function setTab(m) {
      modo = m;
      document.getElementById("tabLogin").classList.toggle("active", m === "login");
      document.getElementById("tabSignup").classList.toggle("active", m === "signup");
      document.getElementById("btnSubmit").textContent = m === "login" ? "Entrar" : "Criar conta";
      document.getElementById("msgErro").textContent = "";
      document.getElementById("msgOk").textContent = "";
    }

    async function handleSubmit(ev) {
      ev.preventDefault();
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      const msgErro = document.getElementById("msgErro");
      const msgOk = document.getElementById("msgOk");
      const btn = document.getElementById("btnSubmit");
      msgErro.textContent = "";
      msgOk.textContent = "";
      btn.disabled = true;

      try {
        if (modo === "login") {
          const { error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
          if (error) throw error;
          window.location.href = "dashboard.html";
        } else {
          const { error } = await supabaseClient.auth.signUp({ email, password: senha });
          if (error) throw error;
          msgOk.textContent = "Conta criada! Verifique seu e-mail (se a confirmação estiver ativa) ou já pode entrar.";
          setTab("login");
        }
      } catch (err) {
        msgErro.textContent = err.message || "Erro ao autenticar.";
      } finally {
        btn.disabled = false;
      }
      return false;
    }

    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) window.location.href = "dashboard.html";
    })();
  </script>
</body>
</html>

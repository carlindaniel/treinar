<!doctype html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de exercícios - Plataforma de Treinamento</title>
<link rel="stylesheet" href="assets/style.css?v=5">
</head>
<body>
  <div class="topbar">
    <div class="brand"><a href="exercicios.html" style="color:inherit;text-decoration:none;">&larr; Plataforma de Treinamento</a></div>
    <nav>
      <a href="dashboard.html">Cursos</a>
      <a href="exercicios.html">Exercícios</a>
      <a href="admin.html">Administração</a>
      <a href="admin_exercicios.html">Admin Exercícios</a>
      <span id="userEmail" class="hint"></span>
      <button class="btn-outline btn-sm" onclick="logout()">Sair</button>
    </nav>
  </div>

  <div class="container container-curso">
    <h2 id="nomeArea" class="loading">Carregando lista...</h2>

    <div id="playerLayout" class="player-layout" style="display:none;">
      <div class="aulas-sidebar">
        <h3 id="tituloSidebar">Exercícios</h3>
        <div class="contador" id="contadorExercicios"></div>
        <input type="text" id="buscaExercicio" placeholder="Pesquisar exercício..." oninput="renderListaExercicios()">
        <div id="listaExercicios" style="margin-top:10px;"></div>
      </div>

      <div class="player-main">
        <div class="player-frame-wrap doc-wrap" id="playerFrameWrap">
          <iframe id="docFrame" src="about:blank" allowfullscreen></iframe>
        </div>
        <div class="hint" style="margin-top:6px;">
          Documento não carregou? <button class="btn-outline btn-sm" onclick="recarregarDoc()">Recarregar</button>
          <a id="linkAbrirDoc" class="btn-outline btn-sm" href="#" target="_blank" rel="noopener" style="text-decoration:none;">Abrir em nova aba</a>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
          <h2 class="player-title" id="tituloExercicio"></h2>
          <button class="btn-outline btn-sm" id="btnEditar" onclick="editarExercicio()">Editar</button>
        </div>
        <div class="hint" id="posicaoExercicio"></div>
        <p class="player-desc" id="descExercicio"></p>

        <div id="editForm" style="display:none; margin-top:8px;">
          <input type="text" id="editTituloInput" placeholder="Título do exercício">
          <textarea id="editDescInput" placeholder="Descrição do exercício" style="margin-top:8px;"></textarea>
          <div class="hint" style="margin-top:8px;">Cor de fundo na lista</div>
          <div class="swatches" id="swatchesBg"></div>
          <div class="hint" style="margin-top:8px;">Cor da fonte na lista</div>
          <div class="swatches" id="swatchesFg"></div>
          <div style="display:flex; gap:8px; margin-top:8px;">
            <button class="btn" onclick="salvarEdicao()">Salvar</button>
            <button class="btn-outline" onclick="cancelarEdicao()">Cancelar</button>
          </div>
        </div>

        <div class="player-controls">
          <button class="btn-outline" id="btnAnterior" onclick="irAnterior()">&larr; Exercício anterior</button>
          <button class="btn" id="btnProximo" onclick="irProximo()">Próximo exercício &rarr;</button>
        </div>
      </div>
    </div>

    <div id="semExercicios" class="empty-state" style="display:none;">Esta lista ainda não possui exercícios cadastrados.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabaseClient.js?v=2"></script>
  <script src="assets/auth-guard.js?v=2"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const idArea = params.get("id");

    let exercicios = [];
    let exercicioAtualId = null;

    // Converte links do Google Docs/Sheets/Slides para a versão incorporável.
    // Outros links (ex: Drive) são exibidos como estão.
    function toEmbedUrl(url) {
      if (!url) return "about:blank";
      const m = url.match(/^(https:\/\/docs\.google\.com\/(document|spreadsheets|presentation)\/d\/[a-zA-Z0-9_-]+)/);
      if (!m) return url;
      const base = m[1];
      if (m[2] === "presentation") return `${base}/embed?start=false&loop=false`;
      if (m[2] === "spreadsheets") return `${base}/htmlview?widget=true&headers=false`;
      return `${base}/preview`;
    }

    // ---- Cores personalizadas (coluna jsonb "estilo": {"bg":"#hex","fg":"#hex"}) ----
    const CORES_FUNDO = ["", "#6c5ce7", "#0984e3", "#00b894", "#e17055", "#d63031", "#e84393", "#fdcb6e", "#2d3436", "#ffffff"];
    const CORES_FONTE = ["", "#ffffff", "#000000", "#fdcb6e", "#55efc4", "#74b9ff", "#fd79a8", "#ff7675", "#a29bfe", "#b2bec3"];
    let corFundoEdit = "", corFonteEdit = "";

    function corValida(v) {
      return typeof v === "string" && /^#[0-9a-fA-F]{6}$/.test(v) ? v : "";
    }

    function estiloCss(ex) {
      const e = ex.estilo || {};
      const bg = corValida(e.bg), fg = corValida(e.fg);
      return (bg ? `background:${bg};` : "") + (fg ? `color:${fg};` : "");
    }

    function renderSwatches(idEl, cores, selecionada, aoEscolher) {
      const el = document.getElementById(idEl);
      el.innerHTML = cores.map(cor =>
        `<button type="button" class="swatch ${cor === selecionada ? "sel" : ""} ${cor ? "" : "swatch-padrao"}"
           data-cor="${cor}" title="${cor || "Padrão"}" style="${cor ? `background:${cor};` : ""}"></button>`
      ).join("");
      el.querySelectorAll(".swatch").forEach(b => b.onclick = () => aoEscolher(b.dataset.cor));
    }

    function renderSwatchesEdicao() {
      renderSwatches("swatchesBg", CORES_FUNDO, corFundoEdit, cor => { corFundoEdit = cor; renderSwatchesEdicao(); });
      renderSwatches("swatchesFg", CORES_FONTE, corFonteEdit, cor => { corFonteEdit = cor; renderSwatchesEdicao(); });
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }

    async function carregarLista() {
      if (!idArea) {
        document.getElementById("nomeArea").textContent = "Lista não informada.";
        return;
      }

      const { data: area, error: erroArea } = await supabaseClient
        .from("listas_area")
        .select("*")
        .eq("id_area", idArea)
        .single();

      if (erroArea || !area) {
        document.getElementById("nomeArea").textContent = "Lista não encontrada.";
        return;
      }

      document.getElementById("nomeArea").textContent = area.nome;
      document.getElementById("tituloSidebar").textContent = area.nome;
      document.title = area.nome + " - Plataforma de Treinamento";

      const { data, error } = await supabaseClient
        .from("exercicios")
        .select("*")
        .eq("id_area", idArea)
        .order("ordem", { ascending: true });

      if (error) {
        document.getElementById("nomeArea").textContent = "Erro ao carregar exercícios: " + error.message;
        return;
      }

      exercicios = data || [];

      if (exercicios.length === 0) {
        document.getElementById("semExercicios").style.display = "block";
        return;
      }

      document.getElementById("playerLayout").style.display = "grid";
      renderListaExercicios();

      const ultimoId = Number(localStorage.getItem(chaveUltimo()));
      const ultimo = exercicios.find(e => e.id_exercicio === ultimoId);
      selecionarExercicio(ultimo ? ultimo.id_exercicio : exercicios[0].id_exercicio);
    }

    function chaveUltimo() {
      return `ultimoExercicio_area_${idArea}`;
    }

    function renderListaExercicios() {
      const termo = document.getElementById("buscaExercicio").value.trim().toLowerCase();
      const filtrados = exercicios.filter(e => e.titulo.toLowerCase().includes(termo));

      document.getElementById("contadorExercicios").textContent =
        `${exercicios.length} exercício${exercicios.length === 1 ? "" : "s"} na lista`;

      const container = document.getElementById("listaExercicios");
      if (filtrados.length === 0) {
        container.innerHTML = `<div class="hint">Nenhum exercício encontrado.</div>`;
        return;
      }

      container.innerHTML = filtrados.map(e => {
        const idx = exercicios.findIndex(x => x.id_exercicio === e.id_exercicio);
        return `<div class="aula-item ${e.id_exercicio === exercicioAtualId ? "active" : ""}" style="${estiloCss(e)}" onclick="selecionarExercicio(${e.id_exercicio})">
          <span class="num" style="color:inherit; opacity:.7;">${idx + 1}.</span>
          <span>${escapeHtml(e.titulo)}</span>
        </div>`;
      }).join("");
    }

    function mostrarDoc(ex) {
      document.getElementById("docFrame").src = toEmbedUrl(ex.url_exercicio);
      document.getElementById("linkAbrirDoc").href = ex.url_exercicio;
    }

    function selecionarExercicio(id) {
      const ex = exercicios.find(e => e.id_exercicio === id);
      if (!ex) return;
      exercicioAtualId = id;
      localStorage.setItem(chaveUltimo(), id);
      cancelarEdicao();

      mostrarDoc(ex);

      document.getElementById("tituloExercicio").textContent = ex.titulo;
      document.getElementById("descExercicio").textContent = ex.descricao || "";

      const idx = exercicios.findIndex(e => e.id_exercicio === id);
      document.getElementById("posicaoExercicio").textContent = `Exercício ${idx + 1} de ${exercicios.length}`;
      document.getElementById("btnAnterior").disabled = idx <= 0;
      document.getElementById("btnProximo").disabled = idx >= exercicios.length - 1;

      renderListaExercicios();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function editarExercicio() {
      const ex = exercicios.find(e => e.id_exercicio === exercicioAtualId);
      if (!ex) return;
      document.getElementById("editTituloInput").value = ex.titulo;
      document.getElementById("editDescInput").value = ex.descricao || "";
      corFundoEdit = corValida((ex.estilo || {}).bg);
      corFonteEdit = corValida((ex.estilo || {}).fg);
      renderSwatchesEdicao();
      document.getElementById("tituloExercicio").style.display = "none";
      document.getElementById("descExercicio").style.display = "none";
      document.getElementById("btnEditar").style.display = "none";
      document.getElementById("editForm").style.display = "block";
    }

    function cancelarEdicao() {
      document.getElementById("tituloExercicio").style.display = "";
      document.getElementById("descExercicio").style.display = "";
      document.getElementById("btnEditar").style.display = "";
      document.getElementById("editForm").style.display = "none";
    }

    async function salvarEdicao() {
      const titulo = document.getElementById("editTituloInput").value.trim();
      const descricao = document.getElementById("editDescInput").value.trim();
      const estilo = {};
      if (corFundoEdit) estilo.bg = corFundoEdit;
      if (corFonteEdit) estilo.fg = corFonteEdit;
      if (!titulo) {
        alert("O título não pode ficar vazio.");
        return;
      }

      const { error } = await supabaseClient
        .from("exercicios")
        .update({ titulo, descricao: descricao || null, estilo })
        .eq("id_exercicio", exercicioAtualId);

      if (error) {
        alert("Erro ao salvar: " + error.message);
        return;
      }

      const ex = exercicios.find(e => e.id_exercicio === exercicioAtualId);
      ex.titulo = titulo;
      ex.descricao = descricao;
      ex.estilo = estilo;

      document.getElementById("tituloExercicio").textContent = titulo;
      document.getElementById("descExercicio").textContent = descricao;
      renderListaExercicios();
      cancelarEdicao();
    }

    function recarregarDoc() {
      const ex = exercicios.find(e => e.id_exercicio === exercicioAtualId);
      if (ex) mostrarDoc(ex);
    }

    function irProximo() {
      const idx = exercicios.findIndex(e => e.id_exercicio === exercicioAtualId);
      if (idx < exercicios.length - 1) selecionarExercicio(exercicios[idx + 1].id_exercicio);
    }

    function irAnterior() {
      const idx = exercicios.findIndex(e => e.id_exercicio === exercicioAtualId);
      if (idx > 0) selecionarExercicio(exercicios[idx - 1].id_exercicio);
    }

    (async () => {
      await requireAuth();
      initTopbarUser("userEmail");
      carregarLista();
    })();
  </script>
</body>
</html>

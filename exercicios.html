<!doctype html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercícios - Plataforma de Treinamento</title>
<link rel="stylesheet" href="assets/style.css?v=4">
</head>
<body>
  <div class="topbar">
    <div class="brand">Plataforma de Treinamento</div>
    <nav>
      <a href="exercicios.html">Exercícios</a>
      <a href="admin_exercicios.html">Admin Exercícios</a>
      <span id="userEmail" class="hint"></span>
      <button class="btn-outline btn-sm" onclick="logout()">Sair</button>
    </nav>
  </div>

  <div class="container">
    <div class="section-title">
      <h2>Listas de exercícios</h2>
    </div>

    <div class="filtros">
      <div>
        <label for="busca">Buscar</label>
        <input type="text" id="busca" placeholder="Nome ou categoria..." oninput="renderListas()">
      </div>
      <div>
        <label for="filtroCategoria">Categoria</label>
        <select id="filtroCategoria" onchange="renderListas()">
          <option value="">Todas</option>
        </select>
      </div>
      <div>
        <label for="filtroQtd">Nº de exercícios</label>
        <select id="filtroQtd" onchange="renderListas()">
          <option value="">Qualquer</option>
          <option value="0-5">Até 5</option>
          <option value="6-15">6 a 15</option>
          <option value="16+">16 ou mais</option>
        </select>
      </div>
      <div>
        <label for="ordenar">Ordenar por</label>
        <select id="ordenar" onchange="renderListas()">
          <option value="nome-asc">Nome (A–Z)</option>
          <option value="nome-desc">Nome (Z–A)</option>
          <option value="qtd-desc">Mais exercícios</option>
          <option value="qtd-asc">Menos exercícios</option>
          <option value="categoria-asc">Categoria (A–Z)</option>
        </select>
      </div>
      <button class="btn-outline btn-sm" onclick="limparFiltros()">Limpar</button>
    </div>
    <p class="hint" id="contagem"></p>

    <div id="listaAreas" class="loading">Carregando listas...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabaseClient.js?v=2"></script>
  <script src="assets/auth-guard.js?v=2"></script>
  <script src="assets/duration-utils.js?v=3"></script>
  <script>
    let listas = [];

    async function carregarListas() {
      const { data, error } = await supabaseClient
        .from("listas_area_com_contagem")
        .select("*");

      const container = document.getElementById("listaAreas");
      if (error) {
        container.innerHTML = `<div class="error-msg">Erro ao carregar listas: ${escapeHtml(error.message)}</div>`;
        return;
      }
      listas = data || [];

      const { data: exs } = await supabaseClient
        .from("exercicios")
        .select("id_area, duracao_segundos");
      const somas = {};
      (exs || []).forEach(e => {
        somas[e.id_area] = (somas[e.id_area] || 0) + (Number(e.duracao_segundos) || 0);
      });
      listas.forEach(l => l.duracao_total_segundos = somas[l.id_area] || 0);
      const sel = document.getElementById("filtroCategoria");
      const cats = [...new Set(listas.map(l => l.categoria).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR"));
      sel.innerHTML = `<option value="">Todas</option>` +
        cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("") +
        `<option value="__sem">Sem categoria</option>`;
      renderListas();
    }

    function formatarHHMM(segundos) {
      const totalMin = Math.round((Number(segundos) || 0) / 60);
      const h = Math.floor(totalMin / 60);
      const m = totalMin % 60;
      return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
    }

    function limparFiltros() {
      ["busca", "filtroCategoria", "filtroQtd"].forEach(id => document.getElementById(id).value = "");
      document.getElementById("ordenar").value = "nome-asc";
      renderListas();
    }

    function dentroFaixa(valor, faixa) {
      if (!faixa) return true;
      if (faixa.endsWith("+")) return valor >= Number(faixa.slice(0, -1));
      const [min, max] = faixa.split("-").map(Number);
      return valor >= min && valor <= max;
    }

    function renderListas() {
      const termo = document.getElementById("busca").value.trim().toLowerCase();
      const cat = document.getElementById("filtroCategoria").value;
      const faixa = document.getElementById("filtroQtd").value;
      const [campo, dir] = document.getElementById("ordenar").value.split("-");

      const filtradas = listas.filter(l =>
        (l.nome.toLowerCase().includes(termo) || (l.categoria || "").toLowerCase().includes(termo)) &&
        (!cat || (cat === "__sem" ? !l.categoria : l.categoria === cat)) &&
        dentroFaixa(Number(l.total_exercicios) || 0, faixa)
      );

      const chave = {
        nome: l => l.nome,
        categoria: l => l.categoria || "",
        qtd: l => Number(l.total_exercicios) || 0
      }[campo];
      filtradas.sort((a, b) => {
        const x = chave(a), y = chave(b);
        const r = typeof x === "string" ? x.localeCompare(y, "pt-BR") : x - y;
        return dir === "desc" ? -r : r;
      });

      document.getElementById("contagem").textContent =
        `${filtradas.length} de ${listas.length} lista${listas.length == 1 ? "" : "s"}`;

      const container = document.getElementById("listaAreas");

      if (filtradas.length === 0) {
        container.innerHTML = `<div class="empty-state">Nenhuma lista encontrada.</div>`;
        return;
      }

      container.innerHTML = `<div class="grid-cursos">
        ${filtradas.map(l => `
          <a class="curso-card" href="lista_exercicios.html?id=${l.id_area}">
            <span class="badge">${l.categoria ? escapeHtml(l.categoria) : "Sem categoria"}</span>
            <h3>${escapeHtml(l.nome)}</h3>
            <span class="meta">${l.total_exercicios} exercício${l.total_exercicios == 1 ? "" : "s"}</span>
            <span class="meta">Duração total: ${formatarHHMM(l.duracao_total_segundos)} (hh:mm)</span>
          </a>
        `).join("")}
      </div>`;
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    (async () => {
      await requireAuth();
      initTopbarUser("userEmail");
      carregarListas();
    })();
  </script>
</body>
</html>
